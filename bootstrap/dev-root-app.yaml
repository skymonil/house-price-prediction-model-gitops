
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/skymonil/house-price-prediction-model-gitops
    targetRevision: main
    path: environments/dev
    helm:
      releaseName: dev-root

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
