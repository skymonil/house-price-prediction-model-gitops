
{{- if .Values.applications.housePriceApi.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.applications.housePriceApi.name }}
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: {{ .Values.global.repoURL | quote }}
      targetRevision: {{ .Values.global.targetRevision | quote }}
      path: {{ .Values.applications.housePriceApi.chartPath }}
      helm:
        releaseName: house-price-api
        valueFiles:
          - $values/{{ .Values.applications.housePriceApi.valuesFile }}

    - repoURL: {{ .Values.global.repoURL | quote }}
      targetRevision: {{ .Values.global.targetRevision | quote }}
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.applications.housePriceApi.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
