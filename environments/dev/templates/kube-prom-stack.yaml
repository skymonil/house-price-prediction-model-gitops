{{- if .Values.applications.kubePrometheusStack.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.applications.kubePrometheusStack.name }}
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: {{ .Values.global.repoURL | quote }}
      targetRevision: {{ .Values.global.targetRevision | quote }}
      path: {{ .Values.applications.kubePrometheusStack.chartPath }}
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/{{ .Values.applications.kubePrometheusStack.valuesFile }}

    - repoURL: {{ .Values.global.repoURL | quote }}
      targetRevision: {{ .Values.global.targetRevision | quote }}
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.applications.kubePrometheusStack.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}