
replicaCount: 1

image:
  repository: YOUR_DOCKERHUB_USERNAME/house-price-api
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automount: false

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

containerPort: 8000

service:
  type: ClusterIP
  port: 8000

probes:
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

env:
  MLFLOW_TRACKING_URI: "mlflow.615915.xyz"
  MLFLOW_MODEL_URI: "models:/HousePricePredictor/1"

extraEnv: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: house-price-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
