replicaCount: 1

image:
  repository: skymonil/house-price-api
  tag: "0071153d28fab6aa0066d22b67b9074015b5e3dd"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

env:
  MLFLOW_TRACKING_URI: "https://mlflow.615915.xyz"
  MLFLOW_MODEL_URI: "models:/HousePricePredictor/1"

probes:
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  readiness:
    enabled: true
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false