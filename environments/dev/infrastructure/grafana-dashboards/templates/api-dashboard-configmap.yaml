{{- if .Values.dashboards.apiMonitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: house-price-api-monitoring
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  api-monitoring.json: |-
{{ .Files.Get (printf "dashboards/%s" .Values.dashboards.apiMonitoring.file) | indent 4 }}
{{- end }}