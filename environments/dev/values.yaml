
global:
  repoURL: https://github.com/skymonil/house-price-prediction-model-gitops
  targetRevision: main

applications:
  housePriceApi:
    enabled: true
    name: house-price-api
    namespace: applications

    chartPath: environments/dev/applications/house-price-api
    valuesFile: environments/dev/values/house-price-api.yaml
    
  kubePrometheusStack:
    enabled: true
    name: kube-prometheus-stack
    namespace: monitoring
    chartPath: environments/dev/infrastructure/kube-prometheus-stack
    valuesFile: environments/dev/values/kube-prometheus-stack.yaml
